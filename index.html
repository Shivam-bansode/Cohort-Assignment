<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon Gen I — Pikachu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="pokemon-card">
    <section class="yellow-panel" aria-label="Pikachu information">
      <div class="pokeball-watermark" aria-hidden="true"></div>
    </section>
    <section class="cream-panel" aria-hidden="true"></section>

    <header class="site-header">
      <a class="logo" href="#" aria-label="Pokémon home">
        <img src="https://raw.githubusercontent.com/PokeAPI/media/master/logo/pokemon_logo.png" alt="Pokémon" />
      </a>
      <button class="menu-button" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </header>

    <section class="copy">
      <p class="eyebrow">POKEMON GEN I</p>
      <h1>Pikachu</h1>
      <p class="description">
        Pikachu is an Electric-type Pokémon introduced<br class="desktop-break" />
        in Generation I. Pikachu are small, chubby,<br class="desktop-break" />
        and incredibly cute mouse-like Pokémon.<br class="desktop-break" />
        They are almost completely covered by<br class="desktop-break" />
        yellow fur.
      </p>
      <div class="slide-count"><span></span><strong>01 / 08</strong></div>
    </section>

    <div class="pokemon-art">
      <img
        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png"
        alt="Pikachu"
      />
    </div>

    <nav class="slide-dots" aria-label="Slides">
      <a class="active" href="#" aria-label="Slide 1"></a>
      <a href="#" aria-label="Slide 2"></a>
      <a href="#" aria-label="Slide 3"></a>
      <a href="#" aria-label="Slide 4"></a>
      <a href="#" aria-label="Slide 5"></a>
    </nav>
  </main>
</body>
</html>
